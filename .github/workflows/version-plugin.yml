name: Version plugin.json

on:
  push:
    paths:
      - 'TwinCat.Xae.Mcp.Server.exe'
      - '.mcp.json'
      - 'agents/**'
      - 'skills/**'
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from exe
        id: version
        shell: pwsh
        run: |
          $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo('TwinCat.Xae.Mcp.Server.exe').ProductVersion
          # Strip git informational suffix (+<hash>) if present
          $ver = $ver -replace '\+.*$', ''
          if (-not $ver) { Write-Error "Could not read ProductVersion from exe"; exit 1 }
          "new_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update plugin.json version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          $json = Get-Content .claude-plugin/plugin.json -Raw | ConvertFrom-Json
          $json.version = $v
          $json | ConvertTo-Json -Depth 10 | Set-Content .claude-plugin/plugin.json

      - name: Update README version badge
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.new_version }}"
          (Get-Content README.md) -replace 'version-\d+\.\d+\.\d+-blue', "version-$v-blue" |
            Set-Content README.md

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json README.md
          $changed = git diff --cached --quiet; if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "chore: bump plugin.json to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push
